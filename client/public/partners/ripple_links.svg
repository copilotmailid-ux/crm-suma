<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Ripple Oval Icon -->
  <g transform="translate(10, 8)">
    <!-- Expanding ripples -->
    <path d="M 12,22 C 2,22 -2,32 8,36 C 18,40 38,36 44,28 C 48,22 42,16 30,16 C 18,16 12,22 12,22 Z" stroke="white" stroke-width="2.5" fill="none" opacity="0.9" />
    <path d="M 4,20 C -8,20 -10,36 4,42 C 18,48 48,42 56,30 C 62,20 52,12 36,12" stroke="white" stroke-width="2" fill="none" opacity="0.6" />
    <!-- Center droplet / pebble -->
    <ellipse cx="20" cy="24" rx="10" ry="7" fill="white" transform="rotate(-15 20 24)" />
  </g>
  
  <!-- Text: RIPPLE LINKS -->
  <text x="76" y="28" fill="white" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="1.5">
    RIPPLE LINKS
  </text>
  
  <!-- Subtitle: Linking Communication Ripples -->
  <text x="77" y="42" fill="white" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" letter-spacing="0.4" opacity="0.95">
    Linking Communication Ripples
  </text>
</svg>
